<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Aeropay Checkout</title>
    <!-- Modern Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CryptoJS for MD5 signature calculation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 backdrop-blur-sm">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-600/10 border border-blue-500/20 text-blue-400 mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                </svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">Aeropay Quick Deposit</h1>
            <p class="text-xs text-slate-400 mt-1">Select or enter your deposit amount</p>
        </div>

        <!-- Notification / Error Box -->
        <div id="errorBox" class="hidden mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs leading-relaxed"></div>

        <!-- Success Result Panel -->
        <div id="successBox" class="hidden mb-6 p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30">
            <div class="flex items-center gap-2 text-emerald-400 text-xs font-semibold uppercase tracking-wider mb-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Deposit Link Ready
            </div>
            <p class="text-xs text-slate-300 mb-2">Order ID: <span id="resOrderId" class="font-mono text-white"></span></p>
            <div class="p-2.5 bg-slate-950/70 border border-slate-800 rounded-lg text-[11px] font-mono text-slate-400 break-all mb-3 select-all" id="resUrl"></div>
            <a id="resPayBtn" href="#" target="_blank" class="block w-full text-center py-2.5 px-4 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-sm transition">
                Proceed to Payment Gateway &rarr;
            </a>
        </div>

        <!-- Deposit Form -->
        <form id="depositForm" onsubmit="handleDeposit(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">Deposit Amount (INR)</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 font-semibold text-base">₹</span>
                    <input type="number" id="amount" min="1" step="1" value="500" required 
                        class="w-full bg-slate-950 border border-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-white font-semibold text-lg pl-9 pr-4 py-3 rounded-xl outline-none transition placeholder-slate-600">
                </div>

                <!-- Preset Amount Badges -->
                <div class="grid grid-cols-4 gap-2 mt-2.5">
                    <button type="button" onclick="setPreset(100)" class="py-1.5 px-2 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 rounded-lg text-xs font-medium text-slate-300 transition">₹100</button>
                    <button type="button" onclick="setPreset(500)" class="py-1.5 px-2 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 rounded-lg text-xs font-medium text-slate-300 transition">₹500</button>
                    <button type="button" onclick="setPreset(1000)" class="py-1.5 px-2 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 rounded-lg text-xs font-medium text-slate-300 transition">₹1,000</button>
                    <button type="button" onclick="setPreset(2000)" class="py-1.5 px-2 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 rounded-lg text-xs font-medium text-slate-300 transition">₹2,000</button>
                </div>
            </div>

            <!-- Auto-redirect toggle -->
            <label class="flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" id="autoRedirect" class="rounded bg-slate-950 border-slate-800 text-blue-600 focus:ring-0 w-4 h-4">
                <span class="text-xs text-slate-400">Auto-redirect straight to cashier page</span>
            </label>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full py-3.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition shadow-lg shadow-blue-600/20 active:scale-[0.99] flex items-center justify-center gap-2">
                <span>Generate Deposit Link</span>
            </button>
        </form>

        <div class="mt-6 text-center text-[11px] text-slate-500">
            Powered by Aeropay Payments • SSL Encrypted
        </div>
    </div>

    <script>
        // Aeropay Gateway Config
        const CONFIG = {
            api_base: 'https://api.aeropay11.live',
            merch_no: 'avtej',
            api_key: 'n5c01VfM44wSwD0tU60Z',
            currency: 'INR',
            notify_url: window.location.origin + '/confirm',
            prefix: 'aero'
        };

        function setPreset(val) {
            document.getElementById('amount').value = val;
        }

        function showError(msg) {
            const errBox = document.getElementById('errorBox');
            errBox.textContent = msg;
            errBox.classList.remove('hidden');
            document.getElementById('successBox').classList.add('hidden');
        }

        // Port of signapi::filterSignableData, buildSignSource & sign
        function generateSign(params, secretKey) {
            // Filter keys
            const filteredKeys = Object.keys(params)
                .filter(k => k !== 'sign' && params[k] !== '' && params[k] !== null && typeof params[k] !== 'object')
                .sort(); // ksort

            const signSource = filteredKeys.map(k => `${k}=${params[k]}`).join('&');
            return CryptoJS.MD5(signSource + secretKey).toString();
        }

        async function handleDeposit(e) {
            e.preventDefault();
            const errBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');
            const btn = document.getElementById('submitBtn');
            
            errBox.classList.add('hidden');
            successBox.classList.add('hidden');

            const amountVal = parseFloat(document.getElementById('amount').value);
            if (!amountVal || amountVal <= 0) {
                showError("Please enter a valid amount.");
                return;
            }

            // Random Identifiers
            const randomUsername = 'usr_' + Math.random().toString(36).substring(2, 8);
            const randomPhone = '9' + Math.floor(100000000 + Math.random() * 900000000);
            const merchantOrderNo = `${CONFIG.prefix}xx${randomUsername}xx${Date.now()}`;
            const formattedAmount = amountVal.toFixed(2);

            const payload = {
                amount: formattedAmount,
                orderNo: merchantOrderNo,
                merchNo: CONFIG.merch_no,
                currency: CONFIG.currency,
                notifyUrl: CONFIG.notify_url,
                phone: randomPhone,
                email: `${randomUsername}@quickpay.net`
            };

            // Sign request with MD5
            payload.sign = generateSign(payload, CONFIG.api_key);

            // Update UI State
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg> Generating...`;

            try {
                const response = await fetch(`${CONFIG.api_base.replace(/\/+$/, '')}/api/payIn`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const resJson = await response.json();

                if (resJson.code !== '0' && resJson.code !== 0) {
                    showError("Gateway Error: " + (resJson.msg || "Transaction rejected by Aeropay"));
                } else {
                    const payUrl = resJson.data?.code_url || '';
                    if (!payUrl) {
                        showError("Order created, but gateway did not provide a payment URL.");
                        return;
                    }

                    if (document.getElementById('autoRedirect').checked) {
                        window.location.href = payUrl;
                    } else {
                        document.getElementById('resOrderId').textContent = merchantOrderNo;
                        document.getElementById('resUrl').textContent = payUrl;
                        document.getElementById('resPayBtn').href = payUrl;
                        successBox.classList.remove('hidden');
                    }
                }
            } catch (err) {
                showError("Network / Gateway Connection Failed: " + err.message + " (Check if https://api.aeropay11.live domain is alive and allows CORS).");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Generate Deposit Link</span>`;
            }
        }
    </script>
</body>
</html>
